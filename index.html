<style>
:root{--bg:#f4f7fc;--c:#fff;--tx:#0d1b3d;--mu:#5b6785;--bd:#dce3f0;--pk:#f2457a;--bl:#1f5aa6;--gr:#1fae84;--or:#e07b00;--pu:#2a55a3;--soft:#ffe8f0;--softb:#e8f0fe;--hd:#0b2a63;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1226;--c:#141c36;--tx:#eaf0ff;--mu:#a3b0d0;--bd:#263259;--soft:#33203a;--softb:#1b284d;--hd:#0c1d4a;--pk:#ff6b9a;--bl:#7fb0ff;--pu:#8fb2ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1226;--c:#141c36;--tx:#eaf0ff;--mu:#a3b0d0;--bd:#263259;--soft:#33203a;--softb:#1b284d;--hd:#0c1d4a;--pk:#ff6b9a;--bl:#7fb0ff;--pu:#8fb2ff;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hd);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:3px solid var(--pk)}
header b{font-size:18px}header small{display:block;font-size:11px;opacity:.9}
.lv{background:var(--pk);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:2px}
.hl{background:#fff;border:2px solid #cfd6e2;border-radius:50%;height:42px;width:42px;margin-right:10px;flex:none;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.22);overflow:hidden;padding:1px}
.hl img{width:100%;height:100%;display:block;object-fit:contain}
#mb{background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:12px;width:40px;height:38px;display:grid;place-items:center;padding:0;cursor:pointer}
main{max-width:740px;margin:0 auto;padding:14px 14px 96px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--c);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:auto}
nav a{flex:1;min-width:50px;text-align:center;padding:7px 2px;color:var(--mu);text-decoration:none;font-size:10px;white-space:nowrap}
nav a span{display:block;font-size:18px;line-height:1.2}
nav a.on{color:var(--pk);font-weight:700}
input[type=search],input[type=text],select{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--c);color:var(--tx);font-size:16px;margin-bottom:10px}
details{background:var(--c);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px}
details>summary{cursor:pointer;padding:12px 14px;list-style:none;display:flex;align-items:center;gap:8px}
details>summary::-webkit-details-marker{display:none}
details.g>summary{font-weight:700;color:var(--pk)}
details.g>summary small{margin-left:auto;color:var(--mu);font-weight:400}
details.g>div{padding:0 10px 4px}
.no{background:var(--pk);color:#fff;border-radius:50%;min-width:26px;height:26px;display:inline-grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.ok{color:var(--gr);font-style:normal;margin-left:auto}
.bd{padding:2px 14px 14px}
.bd p{margin:6px 0}.bd em{font-style:normal;font-weight:700;color:var(--bl);margin-right:6px}
.ex{background:var(--soft);border-radius:10px;padding:6px 10px;margin:8px 0;font-size:17px;line-height:2;display:flex;align-items:flex-start;gap:8px}
.ex>div{flex:1}
.ex i{display:block;font-size:13px;color:var(--mu);line-height:1.4;padding-bottom:4px}
.nt{font-size:14px;color:var(--mu)}
rt{font-size:.52em}
.btn{background:var(--pk);color:#fff;border:0;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer}
.btn.alt{background:var(--c);color:var(--tx);border:1px solid var(--bd)}
.btn.alt.on{background:var(--or);color:#fff;border-color:var(--or)}
.btn.g{background:var(--gr)}.btn.o{background:var(--or)}
.btn small{display:block;font-weight:400;font-size:11px;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;padding:2px 0 10px}
.grid.kgrid{grid-template-columns:repeat(5,1fr)}
.tile{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:8px 2px;font-size:26px;color:var(--tx);line-height:1.2;cursor:pointer;text-align:center}
.tile small{display:block;font-size:10px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.tile.dn{background:var(--soft);border-color:var(--gr)}
.tile.hd{border:2px solid var(--or)}
.tile.empty{visibility:hidden;pointer-events:none}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet>div{background:var(--c);width:100%;max-width:740px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.big{font-size:68px;line-height:1.1;text-align:center;color:var(--pk)}
.row{margin:6px 0;font-size:15px}.row em{font-style:normal;font-weight:700;color:var(--pu);margin-right:6px}
.kv{display:inline-block;background:var(--soft);border-radius:8px;padding:4px 9px;margin:3px 4px 3px 0;font-size:14px;border:0;color:var(--tx);cursor:pointer}
.fc{background:var(--c);border:2px solid var(--bd);border-radius:22px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;margin:10px 0;cursor:pointer}
.fc .big{font-size:90px}
.fc h2{margin:8px 0}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--gr)}
.opt{display:block;width:100%;text-align:left;background:var(--c);border:2px solid var(--bd);color:var(--tx);border-radius:14px;padding:12px 14px;margin:8px 0;font-size:16px;cursor:pointer}
.opt.right{border-color:var(--gr);background:rgba(31,174,132,.15)}.opt.bad{border-color:var(--pk);background:rgba(255,92,147,.15)}
.q{font-size:20px;line-height:2.1;margin:8px 0}
h2{font-size:19px;margin:6px 0 10px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.flex{display:flex;gap:8px;flex-wrap:wrap}.flex>*{flex:1}
.mu{color:var(--mu);font-size:14px}
.spk{background:var(--soft);color:var(--pk);border:0;border-radius:50%;width:34px;height:34px;display:inline-grid;place-items:center;flex:none;vertical-align:middle;padding:0;cursor:pointer}
.spk svg{width:18px;height:18px;fill:currentColor}
.toast{position:fixed;left:14px;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:#2b2b3a;color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;text-align:center}
main,#sh{zoom:var(--z,1)}
html.nofuri rt{display:none}
#mn{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.5);display:none;justify-content:flex-end}
#mn.on{display:flex}
#mp{background:var(--c);width:min(88%,380px);height:100%;overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
#mp h3{font-size:12px;color:var(--mu);margin:18px 0 6px;text-transform:uppercase;letter-spacing:.05em}
.mh{display:flex;align-items:center;justify-content:space-between}.mh b{font-size:20px}.mh .x{background:none;border:0;color:var(--tx);font-size:22px;padding:6px;cursor:pointer}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;min-width:64px;padding:8px 6px;border:1px solid var(--bd);background:var(--c);color:var(--tx);border-radius:10px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--pk);color:#fff;border-color:var(--pk);font-weight:600}
textarea{width:100%;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);padding:10px;font:13px/1.4 ui-monospace,monospace;margin-bottom:8px}
.note{width:100%;font-family:inherit;font-size:14px}
.cp{font-size:13px;line-height:1.65}.cp p{margin:0 0 6px}
.hs{margin-left:auto;color:var(--or);font-style:normal}.hs+.ok{margin-left:6px}
/* Pemula Styling */
.rule-box{background:var(--softb);border-left:4px solid var(--bl);border-radius:10px;padding:10px 12px;margin:8px 0}
.rule-box b{color:var(--bl);font-size:16px}
.tag{display:inline-block;background:var(--pk);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-right:6px}
.tag.b{background:var(--bl)}.tag.g{background:var(--gr)}.tag.o{background:var(--or)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.tbl th,.tbl td{border:1px solid var(--bd);padding:7px 8px;text-align:left}
.tbl th{background:var(--softb);color:var(--bl)}
.song-box{background:linear-gradient(135deg,var(--soft),var(--softb));border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:10px 0}
.v-card{display:flex;align-items:center;justify-content:space-between;background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;gap:8px}
.mini-pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--softb);color:var(--bl)}
.mini-pill.pk{background:var(--soft);color:var(--pk)}
.mini-pill.gr{background:rgba(31,174,132,.15);color:var(--gr)}
.word-chip{display:inline-flex;align-items:center;background:var(--c);border:1.5px solid var(--bd);border-radius:10px;padding:6px 10px;margin:4px;font-size:16px;cursor:pointer;color:var(--tx)}
.word-chip.used{opacity:.35;pointer-events:none}
.sentence-slot{min-height:54px;border:2px dashed var(--bd);border-radius:12px;padding:8px;background:var(--bg);margin:10px 0;display:flex;flex-wrap:wrap;align-items:center}
</style></head><body>

const D={"bp":[{"g":"Kalimat Dasar & Partikel Utama","items":[{"t":"～は～です","r":"Nomina 1 + は + Nomina 2 / Adj + です","m":"Menyatakan identitas, sifat, atau keadaan secara sopan.","ex":[["私(わたし)は学生(がくせい)です。","Saya adalah mahasiswa."],["今日(きょう)は暑(あつ)いです。","Hari ini panas."]],"n":"Partikel は dibaca 'wa'."},{"t":"～ではありません（じゃありません）","r":"Nomina + ではありません / じゃありません","m":"Bentuk negatif sopan untuk kata benda (bukan ...).","ex":[["彼(かれ)は先生(せんせい)ではありません。","Dia bukan guru."],["今日(きょう)は日曜日(にちようび)じゃありません。","Hari ini bukan hari Minggu."]],"n":"じゃありません lebih sering dipakai dalam percakapan sehari-hari."},{"t":"～か（Kalimat Tanya）","r":"Kalimat sopan + か","m":"Mengubah pernyataan menjadi pertanyaan.","ex":[["あなたは日本人(にほんじん)ですか。","Apakah Anda orang Jepang?"],["この本(ほん)はいくらですか。","Berapa harga buku ini?"]],"n":"Dalam bahasa Jepang tidak perlu tanda tanya (?) jika sudah memakai か, meski sering dipakai di teks santai."},{"t":"～の（Kepemilikan & Keterangan）","r":"Nomina 1 + の + Nomina 2","m":"Menunjukkan kepemilikan, asal, atau keterangan benda.","ex":[["これは私(わたし)の本(ほん)です。","Ini adalah buku saya."],["日本語(にほんご)の先生(せんせい)と話(はな)しました。","Saya berbicara dengan guru bahasa Jepang."]],"n":"Nomina 1 menerangkan Nomina 2."},{"t":"～も（Juga）","r":"Nomina + も","m":"Berarti 'juga' (menggantikan は, が, atau を).","ex":[["私(わたし)も学生(がくせい)です。","Saya juga mahasiswa."],["昨日(きのう)はパンも食(た)べました。","Kemarin saya juga makan roti."]],"n":"Untuk partikel に, で, へ, から, まで, も diletakkan setelah partikel tersebut (contoh: にも)."},{"t":"～と（Dan / Bersama）","r":"Nomina 1 + と + Nomina 2 / Orang + と + Verba","m":"Menghubungkan dua kata benda ('dan') atau menyatakan teman melakukan sesuatu ('bersama').","ex":[["机(つくえ)の上(うえ)に本(ほん)とペンがあります。","Di atas meja ada buku dan pena."],["友達(ともだち)と映画(えいが)を見(み)ます。","Saya menonton film bersama teman."]],"n":"Jika dilakukan sendirian, gunakan 一人(ひとり)で tanpa と."},{"t":"～や～（など）","r":"Nomina 1 + や + Nomina 2 (+ など)","m":"Menyebutkan beberapa contoh dari banyak benda ('... dan ..., dan lain-lain').","ex":[["かばんの中(なか)に財布(さいふ)や鍵(かぎ)などがあります。","Di dalam tas ada dompet, kunci, dan lain-lain."],["スーパーで野菜(やさい)や果物(くだもの)を買(か)いました。","Saya membeli sayuran, buah-buahan, dll. di supermarket."]],"n":"Berbeda dengan と yang menyebutkan semua item secara lengkap."},{"t":"これ・それ・あれ／この・その・あの","r":"これ/それ/あれ (berdiri sendiri) · この/その/あの + Nomina","m":"Kata tunjuk benda: ini (dekat pembicara), itu (dekat lawan bicara), itu (jauh dari keduanya).","ex":[["これは何(なん)ですか。","Ini apa?"],["あの車(くるま)は先生(せんせい)のです。","Mobil itu milik guru."]],"n":"これ/それ/あれ tidak bisa langsung diikuti kata benda."}]},{"g":"Tempat, Arah & Keberadaan","items":[{"t":"ここ・そこ・あそこ","r":"ここ / そこ / あそこ + は + Tempat + です","m":"Kata tunjuk tempat: di sini, di situ, di sana.","ex":[["トイレはどこですか。―あそこです。","Toilet di mana? —Di sana."],["ここは食堂(しょくどう)です。","Di sini adalah kantin."]],"n":"Bentuk sopannya adalah こちら・そちら・あちら."},{"t":"～があります／～がいます","r":"Tempat + に + Benda + があります / Makhluk hidup + がいます","m":"Menyatakan keberadaan benda mati (あります) atau manusia/hewan (います).","ex":[["部屋(へや)にテレビがあります。","Di kamar ada TV."],["庭(にわ)に猫(ねこ)がいます。","Di halaman ada kucing."]],"n":"Untuk tanaman dan kendaraan tetap memakai あります."},{"t":"～に～があります／います（Posisi）","r":"Nomina 1 + の + Posisi (上/下/中/前/後ろ/隣) + に + Nomina 2 + があります/います","m":"Menjelaskan letak spesifik suatu benda atau orang.","ex":[["机(つくえ)の下(した)に靴(くつ)があります。","Di bawah meja ada sepatu."],["銀行(ぎんこう)の隣(となり)に郵便局(ゆうびんきょく)があります。","Di sebelah bank ada kantor pos."]],"n":"Partikel lokasi keberadaan selalu に, bukan で."},{"t":"～へ／～に行きます・来ます・帰ります","r":"Tempat + へ / に + 行きます / 来ます / 帰ります","m":"Menunjukkan arah tujuan perpindahan tempat ('ke').","ex":[["明日(あした)東京(とうきょう)へ行(い)きます。","Besok saya pergi ke Tokyo."],["何時(なんじ)に家(いえ)に帰(かえ)りますか。","Jam berapa pulang ke rumah?"]],"n":"Partikel へ dibaca 'e'."},{"t":"～から～まで","r":"Waktu/Tempat 1 + から + Waktu/Tempat 2 + まで","m":"Menunjukkan titik awal dan titik akhir waktu atau jarak ('dari ... sampai ...').","ex":[["9時(くじ)から5時(ごじ)まで働(はたら)きます。","Saya bekerja dari jam 9 sampai jam 5."],["家(いえ)から駅(えき)まで歩(ある)いて10分(じゅっぷん)です。","Dari rumah ke stasiun jalan kaki 10 menit."]],"n":"Bisa juga dipakai terpisah (hanya から atau hanya まで)."},{"t":"～で（Tempat Aktivitas）","r":"Tempat + で + Verba aksi","m":"Menunjukkan lokasi terjadinya suatu kegiatan ('di').","ex":[["図書館(としょかん)で本(ほん)を読(よ)みます。","Saya membaca buku di perpustakaan."],["レストランで昼(ひる)ごはんを食べ(た)ました。","Saya makan siang di restoran."]],"n":"Jangan tertukar dengan に yang dipakai untuk keberadaan (いる/ある)."},{"t":"～で（Alat / Sarana / Bahasa）","r":"Alat/Transportasi/Bahasa + で + Verba","m":"Menunjukkan alat, sarana transportasi, atau bahasa yang digunakan ('dengan / naik').","ex":[["バスで会社(かいしゃ)へ行(い)きます。","Saya pergi ke kantor naik bus."],["日本語(にほんご)で手紙(てがみ)を書(か)きました。","Saya menulis surat dalam bahasa Jepang."]],"n":"Jalan kaki menggunakan 歩(ある)いて (tanpa で)."},{"t":"～に（Waktu Spesifik & Tujuan）","r":"Waktu berangka + に + Verba","m":"Menandai waktu spesifik terjadinya peristiwa ('pada').","ex":[["毎朝(まいあさ)6時(ろくじ)に起(お)きます。","Setiap pagi saya bangun pada jam 6."],["日曜日(にちようび)に買い物(かいもの)をします。","Pada hari Minggu saya berbelanja."]],"n":"Tidak dipakai untuk 今日, 明日, 昨日, 毎日, 今年, dll."}]},{"g":"Konjugasi Dasar Verba & Adjektiva","items":[{"t":"～ます・～ません・～ました・～ませんでした","r":"V bentuk ます (kini/akan) · ません (negatif) · ました (lampau) · ませんでした (negatif lampau)","m":"Bentuk sopan standar untuk kata kerja dalam empat kala dasar.","ex":[["毎日(まいにち)日本語(にほんご)を勉強(べんきょう)します。","Setiap hari saya belajar bahasa Jepang."],["昨日(きのう)はテレビを見(み)ませんでした。","Kemarin saya tidak menonton TV."]],"n":"Bentuk ～ます juga mencakup kebiasaan dan rencana masa depan."},{"t":"～ましょう・～ませんか","r":"V bentuk ます tanpa ます + ましょう / ませんか","m":"ましょう = ajakan ('ayo ...'); ませんか = ajakan sopan ('maukah ...?').","ex":[["一緒(いっしょ)にお茶(ちゃ)を飲(の)みませんか。","Maukah minum teh bersama?"],["ちょっと休(やす)みましょう。","Ayo istirahat sebentar."]],"n":"～ませんか lebih halus karena menanyakan kesediaan lawan bicara."},{"t":"～を（Objek Langsung）","r":"Nomina + を + Verba transitif","m":"Menandai objek langsung dari suatu tindakan.","ex":[["朝(あさ)ごはんを食(た)べます。","Saya makan sarapan."],["音楽(おんがく)を聞(き)きます。","Saya mendengarkan musik."]],"n":"Partikel を dibaca 'o'."},{"t":"～に／から（Memberi & Menerima）","r":"Penerima + に + あげます / 貸します · Pemberi + に/から + もらいます / 借ります","m":"Menunjukkan arah pemberian atau penerimaan barang/informasi.","ex":[["母(はは)に花(はな)をあげました。","Saya memberi bunga kepada ibu."],["友達(ともだち)に辞書(じしょ)を借(か)りました。","Saya meminjam kamus dari teman."]],"n":"Untuk menerima dari instansi/perusahaan, gunakan から."},{"t":"Adj-い（Kini, Negatif, Lampau）","r":"～いです · ～くないです · ～かったです · ～くなかったです","m":"Perubahan bentuk sopan kata sifat-i.","ex":[["この映画(えいが)はとてもおもしろかったです。","Film ini sangat menarik."],["昨日(きのう)は寒(さむ)くなかったです。","Kemarin tidak dingin."]],"n":"Pengecualian: いい berubah menjadi よくないです / よかったです."},{"t":"Adj-な（Kini, Negatif, Lampau）","r":"～です · ～ではありません · ～でした · ～ではありませんでした","m":"Perubahan bentuk sopan kata sifat-na (sama seperti kata benda).","ex":[["この町(まち)は静(しず)かです。","Kota ini tenang."],["試験(しけん)は簡単(かんたん)ではありませんでした。","Ujiannya tidak mudah."]],"n":"Saat menerangkan kata benda di belakangnya, tambahkan な (静かな町)."},{"t":"～が（Suka, Bisa, Paham, Punya）","r":"Objek + が + 好き / 嫌い / 上手 / 下手 / わかります / あります","m":"Menandai objek dari kata sifat perasaan/kemampuan dan verba kepemilikan/pemahaman.","ex":[["私(わたし)はスポーツが好(す)きです。","Saya suka olahraga."],["漢字(かんじ)が少(すこ)しわかります。","Saya sedikit mengerti kanji."]],"n":"Jangan memakai を untuk 好き, 上手, atau わかります."},{"t":"～は～が（Topik & Subjek Bagian）","r":"Topik + は + Subjek/Ciri + が + Predikat","m":"Menjelaskan ciri atau atribut dari suatu topik.","ex":[["象(ぞう)は鼻(はな)が長(なが)いです。","Gajah belalainya panjang."],["日本(にほん)は物価(ぶっか)が高(たか)いです。","Jepang biaya hidupnya mahal."]],"n":"Sangat umum dipakai untuk mendeskripsikan ciri fisik atau keadaan tempat."}]},{"g":"Bentuk て (Te-form) & Penggunaannya","items":[{"t":"～てください","r":"V bentuk て + ください","m":"Meminta atau menyuruh dengan sopan ('tolong ...').","ex":[["ここに名前(なまえ)を書(か)いてください。","Tolong tulis nama di sini."],["もう少しゆっくり話(はな)してください。","Tolong bicara sedikit lebih pelan."]],"n":"Untuk penawaran sopan, bisa juga どうぞ～てください."},{"t":"～ています（Sedang Berlangsung）","r":"V bentuk て + います","m":"Menyatakan tindakan yang sedang berlangsung saat ini.","ex":[["今(いま)、雨(あめ)が降(ふ)っています。","Sekarang sedang turun hujan."],["兄(あに)は電話(でんわ)をかけています。","Kakak sedang menelepon."]],"n":"Sering disertai kata keterangan 今."},{"t":"～ています（Keadaan / Kebiasaan / Pekerjaan）","r":"V bentuk て + います","m":"Menyatakan hasil tindakan yang masih berlanjut, tempat tinggal, status, atau pekerjaan.","ex":[["東京(とうきょう)に住(す)んでいます。","Saya tinggal di Tokyo."],["結婚(けっこん)しています。","Saya sudah menikah."]],"n":"Verba seperti 知っています, 持っています, 住んでいます selalu memakai bentuk ini."},{"t":"～てもいいです","r":"V bentuk て + もいいです","m":"Meminta atau memberi izin ('boleh ...').","ex":[["ここで写真(しゃしん)を撮(と)ってもいいですか。","Bolehkah saya mengambil foto di sini?"],["はい、撮(と)ってもいいです。","Ya, boleh mengambil foto."]],"n":"Jika menolak izin, gunakan ～てはいけません."},{"t":"～てはいけません","r":"V bentuk て + はいけません","m":"Menyatakan larangan ('tidak boleh ...').","ex":[["ここでタバコを吸(す)ってはいけません。","Tidak boleh merokok di sini."],["教室(きょうしつ)で携帯(けいたい)を使(つか)ってはいけません。","Tidak boleh memakai ponsel di kelas."]],"n":"Bernuansa aturan atau larangan tegas."},{"t":"V1て、V2て、～（Urutan Tindakan）","r":"V1 bentuk て、V2 bentuk て、V3","m":"Menghubungkan dua atau lebih tindakan secara berurutan.","ex":[["朝(あさ)起(お)きて、顔(かお)を洗(あら)って、朝(あさ)ごはんを食(た)べます。","Pagi bangun, cuci muka, lalu makan sarapan."],["駅(えき)で電車(でんしゃ)を降(お)りて、歩(ある)いて帰(かえ)りました。","Saya turun kereta di stasiun lalu pulang jalan kaki."]],"n":"Kala kalimat (lampau/kini) ditentukan oleh kata kerja terakhir."},{"t":"～てから（Setelah Melakukan）","r":"V1 bentuk て + から、V2","m":"Menekankan bahwa V2 dilakukan setelah V1 selesai.","ex":[["手(て)を洗(あら)ってから、食(た)べます。","Setelah mencuci tangan, baru makan."],["宿題(しゅくだい)をしてから、ゲームをします。","Setelah mengerjakan PR, baru bermain gim."]],"n":"Berbeda dengan V1て、V2 biasa karena menekankan selesainya tindakan pertama."},{"t":"Adj-い くて / Adj-な で / Nomina で（Sambungan）","r":"Adj-い (tanpa い) + くて · Adj-な / Nomina + で","m":"Menghubungkan dua kata sifat atau kata benda dalam satu kalimat ('... dan ...').","ex":[["この部屋(へや)は広(ひろ)くてきれいです。","Kamar ini luas dan bersih."],["田中(たなか)さんは親切(しんせつ)で、おもしろい人(ひと)です。","Tanaka adalah orang yang ramah dan menarik."]],"n":"Hindari menyambungkan sifat positif dan negatif dengan pola ini (gunakan が)."}]},{"g":"Bentuk ない (Nai-form) & Kewajiban","items":[{"t":"～ないでください","r":"V bentuk ない + でください","m":"Meminta seseorang untuk tidak melakukan sesuatu ('tolong jangan ...').","ex":[["ここで写真(しゃしん)を撮(と)らないでください。","Tolong jangan mengambil foto di sini."],["心配(しんぱい)しないでください。","Tolong jangan khawatir."]],"n":"Lebih halus daripada perintah larangan."},{"t":"～なければなりません","r":"V bentuk ない (tanpa い) + ければなりません","m":"Menyatakan keharusan atau kewajiban ('harus ...').","ex":[["毎日(まいにち)薬(くすり)を飲(の)まなければなりません。","Setiap hari harus minum obat."],["明日(あした)早(はや)く起(お)きなければなりません。","Besok harus bangun pagi."]],"n":"Dalam percakapan sering disingkat menjadi ～なきゃ."},{"t":"～なくてもいいです","r":"V bentuk ない (tanpa い) + なくてもいいです","m":"Menyatakan tidak perlu melakukan sesuatu ('tidak usah / tidak perlu ...').","ex":[["明日(あした)は来(こ)なくてもいいです。","Besok tidak perlu datang."],["靴(くつ)を脱(ぬ)がなくてもいいです。","Tidak usah melepas sepatu."]],"n":"Merupakan lawan makna dari ～なければなりません."},{"t":"～ないで（Tanpa Melakukan）","r":"V1 bentuk ない + で、V2","m":"Melakukan V2 tanpa melakukan V1.","ex":[["砂糖(さとう)を入(い)れないで、コーヒーを飲(の)みます。","Saya minum kopi tanpa memasukkan gula."],["傘(かさ)を持(も)たないで、出(で)かけました。","Saya keluar tanpa membawa payung."]],"n":"V1 adalah cara atau kondisi saat melakukan V2."}]},{"g":"Bentuk Kamus (辞書形) & Kemampuan / Rencana","items":[{"t":"～ことができます","r":"V bentuk kamus / Nomina + ことができます","m":"Menyatakan kemampuan atau kemungkinan melakukan sesuatu ('bisa / dapat ...').","ex":[["私(わたし)は日本語(にほんご)を話(はな)すことができます。","Saya bisa berbicara bahasa Jepang."],["このカードで払(はら)うことができます。","Bisa membayar dengan kartu ini."]],"n":"Jika memakai kata benda aksi (seperti 運転, 料理), cukup Nomina + ができます."},{"t":"趣味は～ことです","r":"私(わたし)の趣味(しゅみ)は + V bentuk kamus + ことです","m":"Menjelaskan hobi berupa kegiatan.","ex":[["私(わたし)の趣味(しゅみ)は音楽(おんがく)を聞(き)くことです。","Hobi saya adalah mendengarkan musik."],["趣味(しゅみ)は写真(しゃしん)を撮(と)ることです。","Hobi saya adalah memotret."]],"n":"Bentuk kamus + こと mengubah kata kerja menjadi frasa nomina."},{"t":"～前に（Sebelum）","r":"V bentuk kamus / Nomina + の / Durasi + 前に","m":"Menyatakan waktu sebelum suatu kejadian ('sebelum ...').","ex":[["寝(ね)る前(まえ)に、本(ほん)を読(よ)みます。","Sebelum tidur, saya membaca buku."],["食事(しょくじ)の前(まえ)に、手(て)を洗(あら)います。","Sebelum makan, saya mencuci tangan."]],"n":"Kata kerja sebelum 前に selalu memakai bentuk kamus, meski kalimat utamanya lampau."},{"t":"～つもりです（Berencana）","r":"V bentuk kamus / V bentuk ない + つもりです","m":"Menyatakan niat atau rencana yang sudah dipikirkan ('berencana untuk ...').","ex":[["来年(らいねん)日本(にほん)へ行(い)くつもりです。","Tahun depan saya berencana pergi ke Jepang."],["明日(あした)はどこへも行(い)かないつもりです。","Besok saya berencana tidak pergi ke mana-mana."]],"n":"Tidak dipakai untuk rencana atasan atau orang yang lebih tua secara langsung."},{"t":"～ながら（Sambil）","r":"V1 bentuk ます (tanpa ます) + ながら、V2","m":"Melakukan dua hal secara bersamaan oleh subjek yang sama ('sambil ...').","ex":[["音楽(おんがく)を聞(き)きながら、勉強(べんきょう)します。","Saya belajar sambil mendengarkan musik."],["歩(ある)きながら、スマホを見(み)ないでください。","Jangan melihat ponsel sambil berjalan."]],"n":"V2 adalah tindakan utamanya."}]},{"g":"Bentuk た (Ta-form) & Pengalaman / Saran","items":[{"t":"～たことがあります","r":"V bentuk た + ことがあります","m":"Menyatakan pengalaman di masa lalu ('pernah ...').","ex":[["日本(にほん)へ行(い)ったことがあります。","Saya pernah pergi ke Jepang."],["納豆(なっとう)を食(た)べたことがありません。","Saya belum pernah makan natto."]],"n":"Tidak dipakai untuk kejadian yang baru saja terjadi kemarin."},{"t":"～たり～たりします","r":"V1 bentuk た + り、V2 bentuk た + りします","m":"Menyebutkan beberapa kegiatan sebagai contoh dari banyak aktivitas ('... dan ... dan sebagainya').","ex":[["日曜日(にちようび)は本(ほん)を読(よ)んだり、映画(えいが)を見(み)たりします。","Pada hari Minggu saya membaca buku, menonton film, dan lain-lain."],["週末(しゅうまつ)は掃除(そうじ)したり、洗濯(せんたく)したりしました。","Akhir pekan saya bersih-bersih, mencuci baju, dll."]],"n":"Bentuk lampau atau negatif diletakkan pada します di akhir."},{"t":"～たほうがいいです","r":"V bentuk た / V bentuk ない + ほうがいいです","m":"Memberi saran atau nasihat ('sebaiknya ...').","ex":[["早(はや)く寝(ね)たほうがいいですよ。","Sebaiknya tidur lebih awal."],["あまり無理(むり)をしないほうがいいです。","Sebaiknya jangan terlalu memaksakan diri."]],"n":"Untuk saran positif memakai bentuk た, sedangkan saran negatif memakai bentuk ない."},{"t":"～後で（Setelah）","r":"V bentuk た / Nomina + の + 後で","m":"Menyatakan urutan waktu setelah suatu kejadian ('setelah ...').","ex":[["仕事(しごと)が終(お)わった後(あと)で、飲(の)みに行(い)きます。","Setelah pekerjaan selesai, saya pergi minum."],["授業(じゅぎょう)の後(あと)で、図書館(としょかん)へ行(い)きます。","Setelah pelajaran, saya pergi ke perpustakaan."]],"n":"Kebalikan dari ～前に."}]},{"g":"Keinginan, Permintaan & Ajakan","items":[{"t":"～がほしいです","r":"Nomina + がほしいです","m":"Menyatakan keinginan terhadap suatu benda ('ingin ...').","ex":[["新(あたら)しいパソコンがほしいです。","Saya ingin komputer baru."],["今(いま)、何(なに)が一番(いちばん)ほしいですか。","Sekarang apa yang paling kamu inginkan?"]],"n":"Dipakai untuk pembicara sendiri atau bertanya langsung pada lawan bicara."},{"t":"～たいです","r":"V bentuk ます (tanpa ます) + たいです","m":"Menyatakan keinginan melakukan suatu tindakan ('ingin ...').","ex":[["日本(にほん)へ行(い)きたいです。","Saya ingin pergi ke Jepang."],["冷(つめ)たい水(みず)が（を）飲(の)みたいです。","Saya ingin minum air dingin."]],"n":"Partikel を boleh diganti menjadi が. Konjugasinya sama seperti Adj-い (～たくないです)."},{"t":"～へ／に～に行きます（Tujuan Pergi）","r":"Tempat + へ/に + V bentuk ます (tanpa ます) / Nomina + に + 行きます/来ます","m":"Menyatakan tujuan pergi atau datang untuk melakukan sesuatu.","ex":[["デパートへ靴(くつ)を買(か)いに行(い)きます。","Saya pergi ke toserba untuk membeli sepatu."],["公園(こうえん)へ散歩(さんぽ)に行(い)きました。","Saya pergi ke taman untuk jalan-jalan."]],"n":"Kata benda aksi seperti 買い物 atau 勉強 bisa langsung diikuti に."},{"t":"～ましょうか","r":"V bentuk ます (tanpa ます) + ましょうか","m":"Menawarkan bantuan kepada orang lain ('mari saya ... / bagaimana kalau saya ...?').","ex":[["荷物(にもつ)を持(も)ちましょうか。","Mari saya bawakan barangnya?"],["窓(まど)を閉(し)めましょうか。","Bagaimana kalau saya tutup jendelanya?"]],"n":"Berbeda dengan ～ましょう yang mengajak melakukan bersama."}]},{"g":"Perubahan, Perbandingan & Alasan","items":[{"t":"～なります（Perubahan Keadaan）","r":"Adj-い (tanpa い) + く · Adj-な / Nomina + に + なります","m":"Menyatakan perubahan keadaan secara alami ('menjadi ...').","ex":[["だんだん暖(あたた)かくなりました。","Berangsur-angsur menjadi hangat."],["来年(らいねん)20歳(はたち)になります。","Tahun depan saya menjadi umur 20 tahun."]],"n":"Perubahan alami (bukan sengaja dibuat orang)."},{"t":"～します（Membuat Jadi）","r":"Adj-い (tanpa い) + く · Adj-な / Nomina + に + します","m":"Menyatakan tindakan sengaja mengubah keadaan sesuatu ('membuat jadi ...').","ex":[["部屋(へや)をきれいにします。","Saya membersihkan (membuat bersih) kamar."],["音(おと)を大(おお)きくしてください。","Tolong besarkan suaranya."]],"n":"Dipakai juga saat memilih menu: カレーにします (Saya pilih kari)."},{"t":"AはBより～です（Perbandingan）","r":"Nomina A + は + Nomina B + より + Adj + です","m":"Membandingkan dua hal ('A lebih ... daripada B').","ex":[["飛行機(ひこうき)は新幹線(しんかんせん)より速(はや)いです。","Pesawat lebih cepat daripada Shinkansen."],["今日(きょう)は昨日(きのう)より涼(すず)しいです。","Hari ini lebih sejuk daripada kemarin."]],"n":"より menandai pembandingnya."},{"t":"AとBとどちらが～ですか","r":"Nomina A + と + Nomina B + と + どちらが + Adj + ですか","m":"Menanyakan perbandingan di antara dua pilihan ('antara A dan B, mana yang lebih ...?').","ex":[["サッカーと野球(やきゅう)とどちらがおもしろいですか。","Antara sepak bola dan bisbol, mana yang lebih menarik?"],["コーヒーと紅茶(こうちゃ)とどちらが好(す)きですか。","Antara kopi dan teh hitam, mana yang lebih kamu suka?"]],"n":"Jawabannya memakai ～のほうが～です."},{"t":"～の中で～が一番～です（Superlatif）","r":"Kategori + の中(なか)で + Pilihan + が一番(いちばん) + Adj + です","m":"Menyatakan tingkat paling tinggi di dalam satu kelompok ('di antara ..., ... yang paling ...').","ex":[["季節(きせつ)の中(なか)で春(はる)が一番(いちばん)好(す)きです。","Di antara musim, saya paling suka musim semi."],["クラスで誰(だれ)が一番(いちばん)背(せ)が高(たか)いですか。","Di kelas siapa yang paling tinggi?"]],"n":"Untuk tempat atau waktu, の中 bisa dihilangkan (contoh: 日本で)."},{"t":"～から（Karena）","r":"Kalimat alasan + から、Kalimat hasil","m":"Menjelaskan sebab atau alasan ('karena ...').","ex":[["時間(じかん)がありませんから、タクシーで行(い)きます。","Karena tidak ada waktu, saya pergi naik taksi."],["風邪(かぜ)を引(ひ)きましたから、会社(かいしゃ)を休(やす)みます。","Karena masuk angin, saya libur kerja."]],"n":"Bisa juga diletakkan di akhir kalimat sebagai jawaban atas どうしてですか."},{"t":"～ので（Karena - Sopan）","r":"Bentuk biasa (Adj-na/Nomina + な) + ので","m":"Menyatakan alasan secara halus dan objektif ('karena ...').","ex":[["雨(あめ)が降(ふ)っているので、出(で)かけません。","Karena sedang hujan, saya tidak keluar."],["病気(びょうき)なので、早(はや)く帰(かえ)ります。","Karena sakit, saya pulang lebih awal."]],"n":"Lebih lembut daripada ～から dan sering dipakai saat meminta izin atau maaf."},{"t":"～が、～（Tetapi）","r":"Kalimat 1 + が、Kalimat 2","m":"Menghubungkan dua kalimat yang bertentangan ('..., tetapi ...').","ex":[["このかばんは高(たか)いですが、とても丈夫(じょうぶ)です。","Tas ini mahal, tetapi sangat kuat."],["日本語(にほんご)は難(むずかしい)ですが、おもしろいです。","Bahasa Jepang sulit, tetapi menarik."]],"n":"Dalam percakapan santai sering memakai けど."}]},{"g":"Bentuk Biasa (普通形), Dugaan & Kutipan","items":[{"t":"～と思います（Menurut Saya）","r":"Bentuk biasa + と思います","m":"Menyatakan pendapat atau dugaan pembicara ('saya rasa / menurut saya ...').","ex":[["明日(あした)は雨(あめ)が降(ふ)ると思(おも)います。","Saya rasa besok akan turun hujan."],["この料理(りょうり)はおいしいと思(おも)います。","Menurut saya masakan ini enak."]],"n":"Adj-na dan Nomina memakai だ sebelum と (雨だと思います)."},{"t":"～と言いました（Berkata Bahwa）","r":"Kalimat kutipan / Bentuk biasa + と言いました","m":"Mengutip ucapan seseorang ('berkata bahwa ...').","ex":[["先生(せんせい)は「明日(あした)テストがあります」と言(い)いました。","Guru berkata, 'Besok ada tes.'"],["彼(かれ)は来週(らいしゅう)帰国(きこく)すると言(い)いました。","Dia berkata akan pulang ke negaranya minggu depan."]],"n":"Kutipan langsung memakai tanda 「 」."},{"t":"～でしょう（Mungkin / Kan?）","r":"Bentuk biasa (Adj-na/Nomina tanpa だ) + でしょう","m":"Menyatakan dugaan dengan cukup yakin atau meminta persetujuan.","ex":[["明日(あした)は晴(は)れるでしょう。","Besok kemungkinan cerah."],["沖縄(おきなわ)は暖(あたた)かいでしょう？","Okinawa hangat, kan?"]],"n":"Intonasi turun untuk dugaan, intonasi naik untuk meminta persetujuan."},{"t":"～かもしれません（Mungkin）","r":"Bentuk biasa (Adj-na/Nomina tanpa だ) + かもしれません","m":"Menyatakan kemungkinan yang tidak pasti ('mungkin saja ...').","ex":[["午後(ごご)から雪(ゆき)が降(ふ)るかもしれません。","Mulai sore mungkin akan turun salju."],["彼(かれ)は今日(きょう)来(こ)ないかもしれません。","Dia mungkin tidak datang hari ini."]],"n":"Tingkat kepastiannya lebih rendah daripada ～でしょう."},{"t":"Bentuk Biasa + Nomina（Anak Kalimat Penjelas）","r":"V/Adj-い bentuk biasa · Adj-な + な · Nomina + の + Nomina","m":"Menerangkan kata benda menggunakan frasa atau kalimat.","ex":[["これは母(はは)が作(つく)ったケーキです。","Ini adalah kue yang dibuat ibu."],["眼鏡(めがね)をかけている人(ひと)は山田(やまだ)さんです。","Orang yang memakai kacamata adalah Yamada."]],"n":"Subjek di dalam anak kalimat penjelas memakai が, bukan は."},{"t":"～とき（Ketika / Saat）","r":"V/Adj-い bentuk biasa · Adj-な + な · Nomina + の + とき","m":"Menunjukkan waktu terjadinya sesuatu ('ketika / pada saat ...').","ex":[["子供(こども)のとき、よく川(かわ)で泳(およ)ぎました。","Ketika anak-anak, saya sering berenang di sungai."],["眠(ねむ)いとき、コーヒーを飲(の)みます。","Saat mengantuk, saya minum kopi."]],"n":"Perhatikan perbedaan V kamus + とき (sebelum/saat berangkat) dan V た + とき (setelah tiba)."},{"t":"～と（Kalau / Begitu - Kondisi Pasti）","r":"V bentuk kamus / V bentuk ない + と","m":"Menyatakan akibat otomatis atau petunjuk arah ('kalau ..., pasti ...').","ex":[["このボタン(ぼたん)を押(お)すと、お釣(つ)りが出(で)ます。","Kalau menekan tombol ini, kembalian akan keluar."],["まっすぐ行(い)くと、右(みぎ)に駅(えき)があります。","Kalau jalan lurus, di sebelah kanan ada stasiun."]],"n":"Bagian belakang tidak boleh berupa keinginan, ajakan, atau perintah."},{"t":"～のに（Padahal / Untuk）","r":"V bentuk kamus + のに (kegunaan) · Bentuk biasa (Adj-na/Nomina + な) + のに (padahal)","m":"Menyatakan fungsi alat ('untuk ...') atau kekecewaan ('padahal ...').","ex":[["このはさみは花(はな)を切(き)るのに使(つか)います。","Gunting ini dipakai untuk memotong bunga."],["約束(やくそく)したのに、彼(かれ)は来(こ)ませんでした。","Padahal sudah berjanji, dia tidak datang."]],"n":"Perhatikan konteks kalimat untuk membedakan fungsi dan kontras."}]},{"g":"Ungkapan Pendukung & Tata Krama","items":[{"t":"～ても（Meskipun）","r":"V bentuk て / Adj-い くて / Adj-な で / Nomina で + も","m":"Menyatakan pengandaian yang berlawanan ('meskipun ...').","ex":[["雨(あめ)が降(ふ)っても、試合(しあい)はあります。","Meskipun hujan turun, pertandingan tetap ada."],["高(たか)くても、買(か)いたいです。","Meskipun mahal, saya ingin membelinya."]],"n":"Sering dipasangkan dengan kata tanya (何を食べても = makan apa pun)."},{"t":"～たら（Kalau / Setelah）","r":"Kalimat bentuk た + ら","m":"Menyatakan syarat pengandaian atau kejadian setelah hal pertama terjadi.","ex":[["時間(じかん)があったら、映画(えいが)を見(み)に行(い)きます。","Kalau ada waktu, saya akan pergi menonton film."],["家(いえ)に着(つ)いたら、電話(でんわ)してください。","Kalau sudah sampai rumah, tolong telepon."]],"n":"Bisa diikuti perintah, ajakan, atau keinginan."},{"t":"～そうです（Kabarnya / Kelihatannya）","r":"Bentuk biasa + そうです (kabar) · V ます / Adj (tanpa い/な) + そうです (kelihatannya)","m":"Menyampaikan kabar dari sumber lain atau kesan visual.","ex":[["天気予報(てんきよほう)によると、明日(あした)は寒(さむ)いそうです。","Menurut ramalan cuaca, kabarnya besok dingin."],["このケーキはとてもおいしそうです。","Kue ini kelihatannya sangat enak."]],"n":"Untuk kelihatannya, いい berubah menjadi よさそうです."},{"t":"～すぎる（Terlalu）","r":"V bentuk ます (tanpa ます) / Adj (tanpa い/な) + すぎる","m":"Menyatakan sesuatu yang berlebihan ('terlalu ...').","ex":[["昨日(きのう)お酒(さけ)を飲(の)みすぎました。","Kemarin saya terlalu banyak minum alkohol."],["この部屋(へや)は狭(せま)すぎます。","Kamar ini terlalu sempit."]],"n":"Konjugasinya mengikuti verba kelompok 2 (～すぎます / ～すぎました)."},{"t":"～やすい・～にくい（Mudah / Sulit Dilakukan）","r":"V bentuk ます (tanpa ます) + やすい / にくい","m":"Menyatakan mudah atau sulitnya suatu tindakan dilakukan.","ex":[["このペンはとても書(か)きやすいです。","Pena ini sangat mudah dipakai menulis."],["この漢字(かんじ)は覚(おぼ)えにくいです。","Kanji ini sulit dihafal."]],"n":"Konjugasinya mengikuti Adj-い."},{"t":"～だけ（Hanya）","r":"Nomina / V bentuk kamus + だけ","m":"Membatasi jumlah atau cakupan ('hanya / saja').","ex":[["クラスに男(おとこ)の子(こ)は一人(ひとり)だけです。","Di kelas anak laki-lakinya hanya satu orang."],["見(み)るだけですから、買(か)いません。","Karena hanya melihat-lihat saja, saya tidak beli."]],"n":"Dalam kalimat positif, berbeda dengan ～しか yang selalu diikuti bentuk negatif."},{"t":"～しか～ません（Hanya - Nuansa Kurang）","r":"Nomina + しか + Verba bentuk negatif","m":"Menyatakan jumlah yang dirasa sedikit/kurang ('hanya ...').","ex":[["財布(さいふ)に千円(せんえん)しかありません。","Di dompet hanya ada seribu yen."],["ひらがなしか書(か)けません。","Saya hanya bisa menulis hiragana."]],"n":"Selalu berpasangan dengan predikat negatif."},{"t":"～ばかり（Baru Saja / Melulu）","r":"V bentuk た + ばかり (baru saja) · Nomina / V て + ばかり (melulu)","m":"Menyatakan hal yang baru saja terjadi atau dilakukan terus-menerus.","ex":[["日本(にほん)に来(き)たばかりです。","Saya baru saja datang ke Jepang."],["弟(おとうと)はゲームをしてばかりいます。","Adik bermain gim melulu."]],"n":"V た + ばかり bisa dipakai meski kejadiannya sudah beberapa minggu lalu jika pembicara merasa baru saja."}]}],"bq":[{"q":"私(わたし)は大学生(だいがくせい)（　）。","o":["です","ます"],"k":0},{"q":"彼(かれ)は先生(せんせい)（　）。","o":["ではありません","くないです"],"k":0},{"q":"机(つくえ)の上(うえ)に本(ほん)（　）ペンがあります。","o":["や","と"],"k":1},{"q":"かばんの中(なか)に財布(さいふ)（　）鍵(かぎ)などがあります。","o":["や","を"],"k":0},{"q":"部屋(へや)にテレビ（　）あります。","o":["が","を"],"k":0},{"q":"庭(にわ)に犬(いぬ)が（　）。","o":["あります","います"],"k":1},{"q":"明日(あした)東京(とうきょう)（　）行(い)きます。","o":["へ","で"],"k":0},{"q":"9時(くじ)（　）5時(ごじ)まで働(はたら)きます。","o":["に","から"],"k":1},{"q":"図書館(としょかん)（　）本(ほん)を読(よ)みます。","o":["で","に"],"k":0},{"q":"バス（　）会社(かいしゃ)へ行(い)きます。","o":["を","で"],"k":1},{"q":"毎朝(まいあさ)6時(ろくじ)（　）起(お)きます。","o":["に","で"],"k":0},{"q":"一緒(いっしょ)にお茶(ちゃ)を飲(の)み（　）。","o":["ません","ませんか"],"k":1},{"q":"母(はは)（　）花(はな)をあげました。","o":["に","から"],"k":0},{"q":"友達(ともだち)（　）辞書(じしょ)を借(か)りました。","o":["を","に"],"k":1},{"q":"昨日(きのう)は寒(さむ)（　） function renderKanaGrid(items, isGojuon){

}

/* ================= KARTU HAFALAN (SRS) ================= */
const SR={mode:'hira',scope:'all',q:[],i:0,flip:false,n:0};
const day=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
const ck=(m,x)=>m==='kj'?'k'+x.k:m==='bp'?'b'+x.id:m==='tg'?'w'+x.w:'n'+x.c;
function srItems(){
  let L = SR.mode==='kj' ? KJ : SR.mode==='bp' ? BPL : SR.mode==='tg' ? TANGO : KANA.filter(x=>x.tp===SR.mode);
  if(SR.scope==='hard') L=L.filter(x=>S.hd[ck(SR.mode,x)]);
  else if(SR.scope.startsWith('t:')) L=(TH().find(t=>t.n===SR.scope.slice(2))||{k:[]}).k;
  else if(SR.scope.startsWith('g:')) L=(D.bp[+SR.scope.slice(2)]||{items:[]}).items;
  else if(SR.scope.startsWith('kg:')) L=L.filter(x=>x.g===SR.scope.slice(3));
  else if(SR.scope.startsWith('tg:')) L=L.filter(x=>x.g===SR.scope.slice(3));
  return L;
}
function srNext(s,g){s=s||{iv:0,ef:2.5,r:0};let{iv,ef,r}=s;if(g===0){iv=0;r=0;ef=Math.max(1.3,ef-.2)}else if(g===1){iv=Math.max(1,Math.round(iv*1.2));ef=Math.max(1.3,ef-.15)}else{iv=r===0?1:r===1?3:Math.round(iv*ef);r++}return{d:day()+iv,iv,ef,r}}
function srStart(){const L=srItems(),t=day(),m=SR.mode,st=x=>S.srs[ck(m,x)];const due=L.filter(x=>st(x)&&st(x).d<=t).sort((a,b)=>st(a).d-st(b).d),nw=L.filter(x=>!st(x)).slice(0,10);SR.q=due.concat(nw);SR.i=0;SR.flip=false;SR.n=0;const si=$('#si');if(si)si.textContent=due.length+' jatuh tempo · '+nw.length+' kartu baru';sdraw()}
function vKartu(){
  const m=SR.mode;
  let opts = `<option value="all">Semua</option><option value="hard">★ Daftar sulit</option>`;
  if(m==='kj') opts += '<optgroup label="Per tema">'+TH().map(t=>`<option value="t:${esc(t.n)}">${esc(t.n)}</option>`).join('')+'</optgroup>';
  else if(m==='bp') opts += '<optgroup label="Per kelompok">'+D.bp.map((g,i)=>`<option value="g:${i}">${esc(g.g)}</option>`).join('')+'</optgroup>';
  else if(m==='tg') opts += '<optgroup label="Per kategori">'+PEMULA.tango.map(g=>`<option value="tg:${esc(g.g)}">${esc(g.g)}</option>`).join('')+'</optgroup>';
  else {
    const src = m==='hira' ? D.hira : D.kata;
    opts += '<optgroup label="Per kelompok">'+src.map(g=>`<option value="kg:${esc(g.g)}">${esc(g.g)}</option>`).join('')+'</optgroup>';
  }
  app.innerHTML=`
    <div class="seg" style="margin-bottom:10px">
      <button data-sm="hira" class="${m==='hira'?'on':''}">Hiragana</button>
      <button data-sm="kata" class="${m==='kata'?'on':''}">Katakana</button>
      <button data-sm="tg" class="${m==='tg'?'on':''}">Kosakata</button>
      <button data-sm="kj" class="${m==='kj'?'on':''}">Kanji</button>
      <button data-sm="bp" class="${m==='bp'?'on':''}">Bunpou</button>
    </div>
    <select id="fs">${opts}</select><p class="mu" id="si"></p><div id="fb"></div>`;
  $('#fs').value=SR.scope;if(!$('#fs').value){SR.scope='all';$('#fs').value='all'}
  $('#fs').onchange=e=>{SR.scope=e.target.value;srStart()};srStart()
}
const kyomi=x=>(x.on!=='—'?x.on:x.kun).split(/[、,]/)[0].replace(/[-・]/g,'');
